[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
ffi = false
fuzz = { runs = 256 }
gas_reports = ["*"]

[profile.ci]
fuzz = { runs = 10000 }

[rpc_endpoints]
baseSepolia = "${BASE_SEPOLIA_RPC}"
base = "${BASE_RPC}"

[etherscan]
# Etherscan API V2 (unified endpoint) — chainId 84532 = Base Sepolia, 8453 = Base
baseSepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=84532" }
base = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=8453" }
